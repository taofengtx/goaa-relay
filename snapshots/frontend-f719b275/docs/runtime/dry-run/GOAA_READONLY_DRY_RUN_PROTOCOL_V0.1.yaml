dry_run_objectives_v0_1:
  - "Confirm that the 5 eligible nodes can be represented in a dry-run task graph without starting real workers."
  - "Confirm that each eligible node has an explicit readonly probe checklist."
  - "Confirm that evidence collection is structured and comparable across nodes."
  - "Confirm that excluded nodes remain excluded until their blockers are resolved."
  - "Confirm that failure handling is defined before any real multi-node execution."

scope_boundaries_v0_1:
  allowed:
    - "Define readonly dry-run protocol."
    - "Define node participation policy."
    - "Define readonly evidence collection schema."
    - "Define failure handling policy."
    - "Define pass/fail criteria."
    - "Define promotion conditions for Phase 2E."
  forbidden:
    - "Execute actual dry-run."
    - "Start worker."
    - "Enable executor."
    - "Dispatch real task."
    - "Connect to DO."
    - "Mutate runtime."
    - "Restart service."
    - "Deploy."
    - "Read secret."
    - "Print secret."
    - "Read private key."
    - "Copy private key."
    - "Delete branch."

