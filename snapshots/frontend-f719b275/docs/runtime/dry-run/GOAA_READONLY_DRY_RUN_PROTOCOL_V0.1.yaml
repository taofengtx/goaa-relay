readonly_probe_command_policy_v0_1:
  linux_allowed_command_classes:
    - "identity_readonly"
    - "hostname_readonly"
    - "os_release_readonly"
    - "kernel_version_readonly"
    - "pwd_readonly"
    - "directory_listing_readonly"
    - "git_status_readonly"
    - "git_head_readonly"
    - "disk_usage_readonly"
    - "memory_snapshot_readonly"
    - "cpu_snapshot_readonly"
    - "network_address_readonly"
    - "service_status_readonly_only_if_no_restart"
  linux_forbidden_command_classes:
    - "package_install"
    - "package_remove"
    - "service_restart"
    - "service_start"
    - "service_stop"
    - "worker_start"
    - "executor_enable"
    - "runtime_mutation"
    - "file_write"
    - "file_delete"
    - "secret_read"
    - "private_key_read"
    - "private_key_copy"
    - "ssh_to_do_without_tao"
    - "deploy"
  do_node_policy:
    protocol_stage_do_connection_allowed: false
    future_dry_run_do_connection_requires_separate_tao_approval: true
    private_key_print_allowed: false
    private_key_copy_allowed: false

evidence_schema_v0_1:
  required_fields:
    - "task_id"
    - "dry_run_id"
    - "node_id"
    - "node_role"
    - "started_at_utc"
    - "ended_at_utc"
    - "probe_status"
    - "commands_executed"
    - "stdout_summary"
    - "stderr_summary"
    - "exit_codes"
    - "runtime_mutation_detected"
    - "worker_started"
    - "service_restarted"
    - "do_connected"
    - "secret_printed"
    - "private_key_read"
    - "private_key_copied"
    - "evidence_hash"
    - "final_marker"
  required_safety_flags:
    runtime_mutation_detected: false
    worker_started: false
    service_restarted: false
    do_connected: false
    secret_printed: false
    private_key_read: false
    private_key_copied: false

failure_handling_v0_1:
  default_policy: "record_failure_and_continue"
  stop_entire_dry_run_if:
    - "secret_printed"
    - "private_key_read"
    - "private_key_copied"
    - "runtime_mutation_detected"
    - "worker_started"
    - "service_restarted"
    - "unexpected_do_connection"
  node_failure_policy:
    local_linux_node_failure: "mark_node_failed_continue_with_remaining_nodes"
    do_node_unreachable: "mark_node_unreachable_continue_no_retry_without_tao"
    windows_node_attempted: "stop_and_report_protocol_violation"
    excluded_node_selected: "stop_and_report_protocol_violation"
  retry_policy:
    automatic_retry_allowed: false
    manual_retry_requires_tao: true
    maximum_retry_without_tao: 0

