summary:
  purpose: "Define the first local-only readonly dry-run execution plan for GOAA multi-node orchestration."
  plan_only_stage: true
  actual_dry_run_execution_allowed: false
  local_readonly_execution_target_count: 2
  do_node_execution_allowed: false
  windows_node_execution_allowed: false
  real_task_dispatch_allowed: false
  worker_start_allowed: false
  executor_enable_allowed: false
  production_deploy_allowed: false
  runtime_mutation_allowed: false
  service_restart_allowed: false
  do_connection_allowed: false
  secret_access_allowed: false
  private_key_access_allowed: false
  branch_delete_allowed: false
  default_decision: "deny"

execution_scope_v0_1:
  allowed_in_this_plan_file:
    - "Define local-only readonly dry-run execution plan."
    - "Define readonly commands for local nodes."
    - "Define evidence collection schema."
    - "Define safety stop rules."
    - "Define pass/fail criteria."
    - "Define promotion conditions for Phase 2F."
  forbidden_in_this_plan_file_creation:
    - "Execute actual dry-run."
    - "Start worker."
    - "Enable executor."
    - "Dispatch real task."
    - "Connect to DO."
    - "Mutate runtime."
    - "Restart service."
    - "Deploy."
    - "Read secret."
    - "Print secret."
    - "Read private key."
    - "Copy private key."
    - "Delete branch."

planned_dry_run_id_template:
  prefix: "GOAA-LOCAL-READONLY-DRY-RUN"
  example: "GOAA-LOCAL-READONLY-DRY-RUN-YYYYMMDD-NNN"
  required_before_execution:
    - "Tao explicit Phase 2F approval."
    - "Aika confirms latest origin/main contains Phase 2E plan."
    - "ChatGPT issues exact execution command package."

local_execution_targets_v0_1:
  - node_id: "local-aika-core-01"
    hostname: "aika-core-01"
    node_type: "local_linux"
    tailscale_ip: "100.114.37.90"
    planned_role: "local_control_plane_readonly_probe"
    capability_level_required: "L1_readonly_probe"
    execution_status_in_phase_2e: "plan_only_not_executed"
    future_execution_allowed_only_after: "Phase 2F Tao approval"
    readonly_probe_steps:
      - step_id: "core_identity"
        command_class: "identity_readonly"
        planned_commands:
          - "hostname"
          - "whoami"
          - "pwd"
        evidence_required:
          - "hostname_output"
          - "whoami_output"
          - "pwd_output"
      - step_id: "core_os"
        command_class: "os_release_readonly"
        planned_commands:
          - "uname -a"
          - "cat /etc/os-release"
        evidence_required:
          - "kernel_summary"
          - "os_release_summary"
      - step_id: "core_network"
        command_class: "network_address_readonly"
        planned_commands:
          - "tailscale ip -4 || true"
          - "ip -brief addr || true"
        evidence_required:
          - "tailscale_ipv4_if_available"
          - "network_interface_summary"
      - step_id: "core_repo"
        command_class: "git_status_readonly"
        planned_commands:
          - "git branch --show-current"
          - "git rev-parse HEAD"
          - "git status --short"
        evidence_required:
          - "current_branch"
          - "current_head"
          - "worktree_status"
      - step_id: "core_resources"
        command_class: "resource_snapshot_readonly"
        planned_commands:
          - "df -h ."
          - "free -h || true"
          - "nproc || true"
          - "uptime || true"
        evidence_required:
          - "disk_snapshot"
          - "memory_snapshot"
          - "cpu_count"
          - "uptime_summary"
      - step_id: "core_runtime_readonly"
        command_class: "service_status_readonly_only_if_no_restart"
        planned_commands:
          - "curl -s --max-time 3 http://127.0.0.1:5188/health || true"
          - "curl -s --max-time 3 http://127.0.0.1:5188/rag/stats || true"
        evidence_required:
          - "local_console_health_if_available"
          - "rag_stats_if_available"
        forbidden:
          - "service restart"
          - "service start"
          - "worker start"
    forbidden_actions:
      - "worker_start"
      - "executor_enable"
      - "runtime_mutation"
      - "service_restart"
      - "production_deploy"
      - "secret_access"
      - "private_key_access"
      - "do_connection"
    node_success_condition:
      - "All planned readonly command classes either return evidence or explicit unavailable reason."
      - "No safety flag becomes true."
      - "No mutation occurs."

  - node_id: "local-aika-2"
    hostname: "aika-2"
    node_type: "local_linux"
    tailscale_ip: "100.97.60.1"
    planned_role: "local_linux_readonly_probe_and_do_jump_path_holder"
    capability_level_required: "L1_readonly_probe"
    execution_status_in_phase_2e: "plan_only_not_executed"
    future_execution_allowed_only_after: "Phase 2F Tao approval"
    readonly_probe_steps:
      - step_id: "aika2_identity"
        command_class: "identity_readonly"
        planned_commands:
          - "hostname"
          - "whoami"
          - "pwd"
        evidence_required:
          - "hostname_output"
          - "whoami_output"
          - "pwd_output"
      - step_id: "aika2_os"
        command_class: "os_release_readonly"
        planned_commands:
          - "uname -a"
          - "cat /etc/os-release"
        evidence_required:
          - "kernel_summary"
          - "os_release_summary"
      - step_id: "aika2_network"
        command_class: "network_address_readonly"
        planned_commands:
          - "tailscale ip -4 || true"
          - "ip -brief addr || true"
        evidence_required:
          - "tailscale_ipv4_if_available"
          - "network_interface_summary"
      - step_id: "aika2_repo"
        command_class: "git_status_readonly"
        planned_commands:
          - "git branch --show-current || true"
          - "git rev-parse HEAD || true"
          - "git status --short || true"
        evidence_required:
          - "repo_presence_or_absence"
          - "current_branch_if_repo"
          - "current_head_if_repo"
          - "worktree_status_if_repo"
      - step_id: "aika2_resources"
        command_class: "resource_snapshot_readonly"
        planned_commands:
          - "df -h ."
          - "free -h || true"
          - "nproc || true"
          - "uptime || true"
        evidence_required:
          - "disk_snapshot"
          - "memory_snapshot"
          - "cpu_count"
          - "uptime_summary"
      - step_id: "aika2_jump_path_metadata_without_do_connection"
        command_class: "jump_path_metadata_probe_without_do_connection"
        planned_commands:
          - "echo DO_CONNECTION_NOT_AUTHORIZED"
          - "echo PRIVATE_KEY_READ_NOT_AUTHORIZED"
        evidence_required:
          - "confirmation_no_do_connection"
          - "confirmation_no_private_key_read"
        forbidden:
          - "ssh to DO"
          - "cat private key"
          - "print private key"
          - "copy private key"
          - "read secret"
    forbidden_actions:
      - "do_connection"
      - "private_key_read"
      - "private_key_copy"
      - "private_key_print"
      - "worker_start"
      - "executor_enable"
      - "runtime_mutation"
      - "service_restart"
      - "production_deploy"
      - "secret_access"
    node_success_condition:
      - "All local readonly evidence is collected or explicitly unavailable."
      - "No DO connection occurs."
      - "No private key is read, printed, or copied."
      - "No mutation occurs."

