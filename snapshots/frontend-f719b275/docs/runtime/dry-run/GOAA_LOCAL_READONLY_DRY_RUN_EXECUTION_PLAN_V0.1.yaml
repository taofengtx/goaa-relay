evidence_package_schema_v0_1:
  package_id_template: "GOAA-LOCAL-READONLY-DRY-RUN-EVIDENCE-YYYYMMDD-NNN"
  required_top_level_fields:
    - "dry_run_id"
    - "task_id"
    - "started_at_utc"
    - "ended_at_utc"
    - "executed_by"
    - "nodes_attempted"
    - "nodes_succeeded"
    - "nodes_failed"
    - "safety_flags"
    - "node_evidence"
    - "final_marker"
  node_evidence_required_fields:
    - "node_id"
    - "hostname"
    - "role"
    - "commands_planned"
    - "commands_executed"
    - "commands_skipped"
    - "stdout_summary"
    - "stderr_summary"
