    runtime_mutation_detected: false
    worker_started: false
    executor_enabled: false
    service_restarted: false
    do_connected: false
    secret_printed: false
    private_key_read: false
    private_key_copied: false
    branch_deleted: false

stop_rules_v0_1:
  stop_entire_run_if:
    - "runtime_mutation_detected"
    - "worker_started"
    - "executor_enabled"
    - "service_restarted"
    - "unexpected_do_connection"
    - "secret_printed"
    - "private_key_read"
    - "private_key_copied"
    - "branch_deleted"
    - "excluded_node_selected"
    - "forbidden_command_class_detected"
  record_and_continue_if:
    - "readonly_command_returns_nonzero"
    - "optional_tool_missing"
    - "local_console_unavailable"
    - "repo_path_absent_on_non_core_node"
  automatic_retry_allowed: false
  retry_requires_tao: true

