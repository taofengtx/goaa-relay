      - "Do not read private key content."

simulation_lifecycle_v0_1:
  step_1_prepare_envelope:
    actor: "local-aika-core-01"
    action: "Create simulated dispatch envelope as console output only."
    file_write_allowed: false
  step_2_route_decision:
    actor: "local-aika-core-01"
    action: "Select local-aika-2 as verification target based on Phase 2H readiness."
    real_dispatch_allowed: false
  step_3_aika2_repo_verification:
    actor: "local-aika-2"
    action: "Perform readonly repo verification commands only."
    allowed_command_classes:
      - "git_fetch_origin_main"
      - "git_status"
      - "git_rev_parse"
      - "git_log"
      - "git_ls_tree"
      - "du_readonly"
  step_4_evidence_return:
    actor: "local-aika-2"
    action: "Return structured evidence to control node / ChatGPT."
  step_5_review_gate:
    actor: "ChatGPT"
    action: "Review evidence and recommend whether Phase 2J execution can be approved."
  step_6_tao_decision:
    actor: "Tao"
    action: "Approve or reject Phase 2J actual readonly simulation execution."

simulated_dispatch_envelope_schema:
  envelope_id_template: "GOAA-LOCAL-2NODE-READONLY-SIM-YYYYMMDD-NNN"
  required_fields:
    - "envelope_id"
    - "simulation_phase"
    - "created_by"
    - "control_node"
    - "target_node"
    - "authorized_command_classes"
    - "forbidden_actions"
    - "expected_evidence"
    - "stop_rules"
    - "safety_flags"
  example:
    envelope_id: "GOAA-LOCAL-2NODE-READONLY-SIM-20260621-001"
    simulation_phase: "Phase 2J candidate"
    control_node: "local-aika-core-01"
    target_node: "local-aika-2"
    authorized_command_classes:
      - "repo_readonly_verify"
      - "phase_file_verify"
    forbidden_actions:
      - "real_worker_start"
      - "executor_enable"
      - "do_connection"
      - "runtime_mutation"
      - "secret_read"
      - "private_key_content_read"
      - "push"
      - "deploy"

evidence_schema_v0_1:
  required_top_level_fields:
    - "simulation_id"
    - "control_node"
    - "target_node"
    - "repo_path_present"
    - "current_head"
    - "origin_main_head"
    - "head_matches_origin_main"
    - "phase_files_present"
    - "worktree_status"
    - "safety_flags"
    - "final_marker"
  required_safety_flags:
    file_modified: false
    commit_performed: false
    push_performed: false
    pr_created: false
    merge_performed: false
    deploy_performed: false
    worker_started: false
    executor_enabled: false
    service_restarted: false
    do_connected: false
    secret_read_attempted: false
    private_key_content_read_attempted: false
    branch_delete_performed: false

stop_rules_v0_1:
  stop_immediately_if:
    - "worker_started"
    - "executor_enabled"
    - "do_connected"
    - "runtime_mutation_detected"
    - "service_restarted"
    - "secret_read_attempted"
    - "private_key_content_read_attempted"
    - "push_attempted"
    - "deploy_attempted"
    - "branch_delete_attempted"
  record_and_continue_if:
    - "git_fetch_returns_no_new_commits"
    - "repo_already_up_to_date"
    - "optional_probe_unavailable"
  retry_allowed_without_tao: false

phase_2j_entry_conditions:
  next_recommended_phase: "Phase 2J Local Two-Node Readonly Dispatch Simulation Execution V0.1"
  may_enter_phase_2j_only_after:
