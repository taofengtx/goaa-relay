local_two_node_roles:
  control_node:
    node_id: "local-aika-core-01"
    hostname: "aika-core-01"
    tailscale_ip: "100.114.37.90"
    role: "readonly_dispatch_simulation_controller"
    responsibilities:
      - "Generate simulated dispatch envelope."
      - "Record simulated routing decision."
      - "Do not start worker."
      - "Do not enable executor."
      - "Do not mutate runtime."
  verification_node:
    node_id: "local-aika-2"
    hostname: "aika-2"
    tailscale_ip: "100.97.60.1"
